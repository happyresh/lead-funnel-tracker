[project]
name = "lead-funnel"
version = "0.1.0"
description = "Turns event leads into a weekly per-agency conversion report in Excel"
authors = [{ name = "happyresh" }]
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
]

[project.scripts]
lead-funnel = "lead_funnel.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
